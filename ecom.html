<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Simple E-Commerce</title>
<style>
body {
  font-family: Arial;
  margin: 0;
  background: #f4f4f4;
}

header {
  background: #333;
  color: white;
  padding: 15px;
  display: flex;
  justify-content: space-between;
}

button {
  background: #28a745;
  color: white;
  border: none;
  padding: 8px;
  cursor: pointer;
  margin: 5px;
}

.products {
  display: flex;
  gap: 20px;
  padding: 20px;
}

.product {
  background: white;
  padding: 15px;
  border-radius: 10px;
  width: 180px;
  text-align: center;
}

.product img {
  width: 100%;
  height: 120px;
  object-fit: cover;
}

.cart {
  position: fixed;
  right: 0;
  top: 60px;
  width: 250px;
  background: white;
  padding: 15px;
  display: none;
  border-left: 2px solid #ccc;
  height: 100%;
  overflow-y: auto;
}

.hidden {
  display: none;
}

.page {
  padding: 20px;
}
</style>
</head>

<body>

<header>
  <h1>Aryan's Shop</h1>
  <div>
    <button onclick="showPage('shop')">Shop</button>
    <button onclick="showPage('checkout')">Checkout</button>
    <button onclick="toggleCart()">Cart (<span id="cart-count">0</span>)</button>
    <button onclick="logout()">Logout</button>
  </div>
</header>

<!-- LOGIN PAGE -->
<div id="login-page" class="page">
  <h2>Login</h2>
  <input type="text" id="username" placeholder="Enter username"><br><br>
  <input type="password" id="password" placeholder="Enter password"><br><br>
  <button onclick="login()">Login</button>
</div>

<!-- SHOP PAGE -->
<div id="shop-page" class="page hidden">
  <h2>Products</h2>
  <div class="products" id="product-list"></div>
</div>

<!-- CHECKOUT PAGE -->
<div id="checkout-page" class="page hidden">
  <h2>Checkout</h2>
  <ul id="checkout-items"></ul>
  <h3>Total: ₹<span id="checkout-total">0</span></h3>
  <button onclick="placeOrder()">Place Order</button>
</div>

<!-- CART -->
<div class="cart" id="cart">
  <h2>Your Cart</h2>
  <ul id="cart-items"></ul>
  <p>Total: ₹<span id="total">0</span></p>
</div>

let cart = [];
let loggedIn = false;

function login() {
  const user = document.getElementById("username").value;
  const pass = document.getElementById("password").value;

  if(user && pass) {
    loggedIn = true;
    document.getElementById("login-page").classList.add("hidden");
    document.getElementById("shop-page").classList.remove("hidden");
  } else {
    alert("Enter valid details");
  }
}

function logout() {
  loggedIn = false;
  location.reload();
}

function showPage(page) {
  if(!loggedIn) return alert("Please login first");

  document.getElementById("shop-page").classList.add("hidden");
  document.getElementById("checkout-page").classList.add("hidden");

  document.getElementById(page + "-page").classList.remove("hidden");

  if(page === "checkout") updateCheckout();
}

function displayProducts() {
  const list = document.getElementById("product-list");

  products.forEach(p => {
    const div = document.createElement("div");
    div.className = "product";
    div.innerHTML = `
      <img src="${p.img}">
      <h3>${p.name}</h3>
      <p>₹${p.price}</p>
      <button onclick="addToCart(${p.id})">Add</button>
    `;
    list.appendChild(div);
  });
}

function addToCart(id) {
  const product = products.find(p => p.id === id);
  cart.push(product);
  updateCart();
}

function removeFromCart(index) {
  cart.splice(index, 1);
  updateCart();
}

function updateCart() {
  const cartItems = document.getElementById("cart-items");
  const totalDisplay = document.getElementById("total");
  const cartCount = document.getElementById("cart-count");

  cartItems.innerHTML = "";
  let total = 0;

  cart.forEach((item, index) => {
    const li = document.createElement("li");
    li.innerHTML = `
      ${item.name} - ₹${item.price}
      <button onclick="removeFromCart(${index})">X</button>
    `;
    cartItems.appendChild(li);
    total += item.price;
  });

  totalDisplay.textContent = total;
  cartCount.textContent = cart.length;
}

function updateCheckout() {
  const list = document.getElementById("checkout-items");
  const totalDisplay = document.getElementById("checkout-total");

  list.innerHTML = "";
  let total = 0;

  cart.forEach(item => {
    const li = document.createElement("li");
    li.textContent = `${item.name} - ₹${item.price}`;
    list.appendChild(li);
    total += item.price;
  });

  totalDisplay.textContent = total;
}

function placeOrder() {
  if(cart.length === 0) {
    alert("Cart is empty!");
    return;
  }

  alert("Order placed successfully!");
  cart = [];
  updateCart();
  updateCheckout();
}

function toggleCart() {
  const cartDiv = document.getElementById("cart");
  cartDiv.style.display =
    cartDiv.style.display === "block" ? "none" : "block";
}

displayProducts();
</script>
