<!DOCTYPE html>
<html>
<head>
  <title>Dashboard</title>
</head>
<body>

<h1>Welcome to Dashboard 🎉</h1>
<button onclick="logout()">Logout</button>

<script>
  if (localStorage.getItem("isAuthenticated") !== "true") {
    window.location.href = "index.html";
  }

  function logout() {
    localStorage.removeItem("isAuthenticated");
    window.location.href = "index.html";
  }
</script>

</body>
</html>
